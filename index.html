<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F9F5EC" />
<title>Fáze</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    /* active / self-development palette — cool, fresh, premium */
    --bg1:#FBFAF5; --bg2:#F5F3EC;
    --ink:#1E241F; --muted:#79837B;
    --energy:#EC6142; --energy-deep:#D14B2E;   /* coral — CTA / high energy */
    --calm:#2F8072;                            /* teal-green — low energy   */
    --card:#FFFFFF;
    --hi:#FCEAE2;   /* high-energy card tint  */
    --lo:#E5EEEB;   /* low-energy card tint   */
    --radius:24px;
    --shadow:0 18px 40px -24px rgba(30,45,35,.42), 0 4px 14px -9px rgba(30,45,35,.20);
    --shadow-sm:0 8px 22px -16px rgba(30,45,35,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter',-apple-system,system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 100%);
    background-attachment:fixed;min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:26px 20px 120px}
  .serif{font-family:'Fraunces',Georgia,serif;font-weight:500}
  .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .muted{color:var(--muted)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:15px;color:var(--ink)}

  /* header */
  header.hero{margin-bottom:20px}
  .brand{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--energy-deep);font-weight:600;margin-bottom:14px}
  .brandlogo{height:34px;width:auto;max-width:100%;display:block;margin:0 0 14px -2px}
  h1.title{font-size:40px;line-height:1.04;margin:0;letter-spacing:-.01em}
  h1.title em{font-style:italic;color:var(--energy);font-weight:500}
  .wave{width:120px;height:16px;margin-top:14px;color:var(--energy);opacity:.9}
  .subline{margin-top:10px;color:var(--muted);font-size:14px;max-width:40ch}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:2px 2px 18px;font-size:11.5px;color:var(--muted);font-weight:500}
  .legend span{white-space:nowrap}

  /* spend + week nav */
  .spendbar{display:flex;gap:10px;margin:18px 0 14px;flex-wrap:wrap}
  .chip{background:var(--card);border-radius:18px;padding:11px 16px;box-shadow:var(--shadow-sm);flex:1;min-width:120px;cursor:pointer}
  .chip:active{transform:scale(.99)}
  .spendtotal{display:flex;justify-content:space-between;align-items:baseline;padding:11px 2px 2px;border-top:1.5px solid #EBE4D6;font-family:'Fraunces',serif;font-weight:600;font-size:18px}
  .spendtotal.sub2{border-top:none;font-family:'Inter',sans-serif;font-size:12.5px;color:var(--muted);font-weight:500;padding-top:6px}
  .chip .v{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin-top:2px}
  .chip .v small{font-size:13px;font-weight:500;color:var(--muted);font-family:'Inter',sans-serif}
  .weeknav{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 18px}
  .wbtn{width:40px;height:40px;border-radius:999px;background:var(--card);box-shadow:var(--shadow-sm);
    font-size:20px;font-weight:600;color:var(--ink);line-height:1;display:flex;align-items:center;justify-content:center}
  .wbtn:active{transform:scale(.94)}
  .wnow{flex:0 1 auto;min-width:130px;text-align:center;padding:10px 18px;border-radius:999px;
    background:var(--card);box-shadow:var(--shadow-sm);font-weight:600;font-size:14px;color:var(--ink)}
  .wnow.here{color:var(--muted)}

  /* when should I…? */
  .whenbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:#F7F3EC;border-radius:18px;padding:16px 20px;margin:0 0 16px;box-shadow:var(--shadow-sm)}
  .whenbtn:active{transform:scale(.99)}
  .whenbtn .q{font-family:'Fraunces',serif;font-style:italic;font-size:18px}
  .whenbtn svg{width:18px;height:18px;opacity:.85}
  .whenback{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;gap:10px;align-items:center}
  .whenback button{color:var(--energy-deep);font-weight:600}
  .typehint.big{gap:8px}
  .typehint.big button{font-size:13.5px;padding:9px 14px;background:#EFEAE0;color:var(--ink)}
  .whenres{text-align:center;padding:16px 0 4px}
  .whenact{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:6px}
  .whenwin{font-family:'Fraunces',serif;font-size:34px;font-weight:600;line-height:1.05}
  .whenphase{font-size:13px;font-style:italic;font-family:'Fraunces',serif;margin-top:5px}
  .whenweek{margin-top:18px;font-size:13.5px;display:flex;flex-direction:column;gap:5px}

  /* passes */
  .passwrap{margin:0 0 16px}
  .passhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .passadd{font-size:12px;font-weight:600;color:var(--energy-deep)}
  .passrow{display:flex;gap:9px;overflow-x:auto;padding-bottom:3px}
  .pass{flex:0 0 auto;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow-sm);text-align:left;min-width:118px;display:flex;flex-direction:column;gap:1px}
  .pass:active{transform:scale(.98)}
  .pass .pn{font-weight:600;font-size:13.5px}
  .pass .pr{font-size:11.5px;color:var(--muted)}
  .pass .pp{font-size:11px;color:var(--muted);font-weight:600}
  .pass.low{outline:1.5px solid #E4B36A}
  .pass.low .pr{color:#B5722A;font-weight:600}
  .pass.empty{color:var(--muted);font-size:12.5px;font-weight:500;min-width:auto;flex-direction:row;align-items:center}
  .linklike{color:var(--energy-deep);font-weight:600;text-decoration:underline}
  .placeblock{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #EFE9DD}
  .placeblock:last-of-type{border-bottom:none;padding-bottom:0}
  .placehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .placename{font-family:'Fraunces',serif;font-size:16px;font-weight:600}
  .addclass{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--energy-deep)}
  .field select{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid #DCE2DB;background:#fff;outline:none}

  /* day cards */
  .day{border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .day.today{outline:2px solid var(--energy);outline-offset:2px}
  .day.high{background:var(--hi)}
  .day.low{background:var(--lo)}
  .day-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .day-name{font-family:'Fraunces',serif;font-size:19px;font-weight:600}
  .day-date{font-size:12px;color:var(--muted);margin-left:6px;font-weight:500}
  .todaytag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--energy-deep);font-weight:700}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 8px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.7)}
  .pill.foll{color:var(--energy-deep)} .pill.ovu{color:#B0451F}
  .pill.lut{color:var(--calm)} .pill.men{color:#7c6f6a}
  .pill svg{width:14px;height:14px}
  .nudge{font-size:13px;color:var(--ink);opacity:.72;margin-top:8px;font-style:italic;font-family:'Fraunces',serif}
  .acts{margin-top:12px;display:flex;flex-direction:column;gap:8px}

  /* activity row */
  .act{display:flex;align-items:flex-start;gap:11px;background:#F6F3EC;border-radius:16px;padding:11px 13px;text-align:left;width:100%}
  .act:active{transform:scale(.99)}
  .cat-badge{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-size:17px;background:var(--c,#eee);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
  .act .body{flex:1;min-width:0}
  .a-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .a-name{font-size:14.5px;font-weight:600;line-height:1.25}
  .a-name .rep{font-size:9px;opacity:.55;margin-left:4px}
  .cost{font-size:12.5px;font-weight:600;white-space:nowrap}
  .cost.free{color:var(--calm)}
  .a-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .a-flag{font-size:11.5px;margin-top:7px;line-height:1.35;padding:5px 9px;border-radius:9px;font-weight:500}
  .a-flag.o{background:#FBEEDD;color:#A9661F}
  .a-flag.r{background:#FBE7E4;color:#BE4A41}
  .empty{font-size:12.5px;color:var(--muted);opacity:.7;margin-top:10px}

  /* view toggle + month grid */
  .viewtog{display:flex;background:#E6EAE4;border-radius:14px;padding:4px;gap:4px;margin:0 0 16px}
  .viewtog button{flex:1;padding:9px;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--muted)}
  .viewtog button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
  .mdow{text-align:center;font-size:10px;letter-spacing:.06em;color:var(--muted);font-weight:600;padding-bottom:2px}
  .mcell{aspect-ratio:1;border-radius:13px;padding:7px 8px;position:relative;font-size:12.5px;font-weight:600;color:var(--ink);text-align:left;overflow:hidden}
  .mcell.blank{background:transparent!important;pointer-events:none}
  .mcell.high{background:var(--hi)} .mcell.low{background:var(--lo)}
  .mcell.today{outline:2px solid var(--energy);outline-offset:-2px}
  .mcell .mmark{position:absolute;bottom:7px;right:8px;width:7px;height:7px;border-radius:50%;background:rgba(46,40,35,.32)}
  .mcell .mmark.cau{background:#D0514A}
  /* best-windows list */
  .winlist{display:flex;flex-direction:column}
  .win{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #EFE9DD}
  .win:last-child{border-bottom:none}
  .win-main{flex:1;min-width:0}
  .win-name{font-size:14px;font-weight:600}
  .win-times{font-size:12.5px;margin-top:2px}
  .wgood{color:#4E9B63;font-weight:600}
  .wavoid{color:#B5722A}
  /* phase guide cards */
  .phasecard{border-radius:20px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
  .phasehead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:5px}
  .phasename{font-family:'Fraunces',serif;font-size:18px;font-weight:600}
  .phasedates{font-size:12px;color:var(--muted);font-weight:600}
  .phaseintro{font-size:13px;color:var(--ink);opacity:.82;font-style:italic;font-family:'Fraunces',serif;margin-bottom:13px}
  .nicelist{display:flex;flex-wrap:wrap;gap:7px}
  .nicechip{background:#F4F0E8;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:500;cursor:pointer;transition:transform .08s;color:var(--ink)}
  .nicechip:active{transform:scale(.95)}
  .nicechip .np{opacity:.5;font-weight:700;margin-right:5px}
  .dateline{margin-top:12px;font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
  .wrange{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
  .predict{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1.6px solid #5B86A6;border-radius:18px;padding:13px 18px;margin:0 0 16px;box-shadow:var(--shadow-sm);cursor:pointer}
  .predict .label{color:#5B86A6}
  .predict .pv{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin-top:2px;color:var(--ink)}
  .predict .pdays{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
  .catsum{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:14px;font-weight:600}
  .catsum .cat-badge{width:30px;height:30px;font-size:15px}
  .catsum .linklike{margin-left:auto;font-size:12.5px}
  .mcell.out{opacity:.4}

  /* buttons / footer */
  .footer{margin-top:26px;display:flex;flex-direction:column;gap:10px}
  .btn{border-radius:999px;padding:15px 20px;font-size:15px;font-weight:600;text-align:center;transition:transform .08s,box-shadow .2s}
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--energy);color:#fff;box-shadow:0 12px 26px -12px rgba(236,97,66,.9)}
  .btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}
  .btn.disabled{background:#E4E7E2;color:var(--muted);box-shadow:none;cursor:not-allowed}
  .importnote{font-size:11.5px;color:var(--muted);text-align:center;margin-top:-2px}
  .disclaimer{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;opacity:.85}

  .fab{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;background:var(--energy);color:#fff;
    border-radius:999px;padding:15px 26px;font-weight:600;font-size:15px;box-shadow:0 16px 34px -12px rgba(236,97,66,.95);
    display:flex;align-items:center;gap:9px}
  .fab:active{transform:translateX(-50%) scale(.97)}
  .fab svg{width:18px;height:18px}

  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(24,32,26,.44);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .scrim.open{display:flex}
  .sheet{background:linear-gradient(165deg,var(--bg1),#fff 60%);width:100%;max-width:560px;border-radius:28px 28px 0 0;
    padding:22px 22px 30px;box-shadow:0 -20px 50px -20px rgba(24,32,26,.5);max-height:92vh;overflow-y:auto;
    animation:rise .28s cubic-bezier(.2,.8,.25,1)}
  @keyframes rise{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
  .sheet h2{font-family:'Fraunces',serif;font-size:24px;font-weight:600;margin:0 0 4px}
  .sheet .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .field{margin-bottom:16px}
  .field>.label{display:block;margin-bottom:7px}
  .field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number]{
    width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid #DCE2DB;background:#fff;outline:none}
  .field input:focus{border-color:var(--energy)}
  .catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
  .catcell{background:#fff;border:1.5px solid #DCE2DB;border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;
    align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--muted)}
  .catcell .ce{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--c)}
  .catcell.on{border-color:var(--c);color:var(--ink);box-shadow:0 6px 16px -10px var(--c)}
  .seg{display:flex;background:#E6EAE4;border-radius:14px;padding:4px;gap:4px;margin-bottom:18px}
  .seg button{flex:1;padding:10px;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
  .dows{display:flex;gap:6px;flex-wrap:wrap}
  .dow{width:40px;height:40px;border-radius:12px;background:#fff;border:1.5px solid #DCE2DB;font-size:13px;font-weight:600;color:var(--muted)}
  .dow.on{background:var(--energy);color:#fff;border-color:var(--energy)}
  .toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
  .toggle input{width:20px;height:20px;accent-color:var(--energy)}
  .sheet-actions{display:flex;gap:10px;margin-top:8px}
  .sheet-actions .btn{flex:1}
  .btn.danger{background:none;color:#b4483a;box-shadow:none;border:1.5px solid #e6c9c3}
  .hidden{display:none!important}
  .typehint{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .typehint button{font-size:11.5px;padding:5px 10px;border-radius:999px;background:#EDF0EB;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<button class="fab hidden" id="fab" onclick="openActivity()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Add
</button>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<script>
/* ---------------- storage ---------------- */
const K_CYCLE='whenTo.cycle', K_ACTS='whenTo.activities';
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const K_PASSES='whenTo.passes', K_PLACES='whenTo.places', K_CLASSES='whenTo.classes', K_PERIODS='whenTo.periods';
let cycle=load(K_CYCLE,null);
let activities=load(K_ACTS,[]);
let passes=load(K_PASSES,[]);
let places=load(K_PLACES,[]);
let classes=load(K_CLASSES,[]);
let periods=load(K_PERIODS, cycle&&cycle.lastPeriodStart?[cycle.lastPeriodStart]:[]);
let weekOffset=0;
let viewMode='week';        // 'week' | 'month' | 'spend'
let monthCursor=null;       // Date of displayed month
let spendPeriod='month';    // 'week' | 'month'
let prevCalView='week';     // where to return from the spend screen

/* ---------------- categories ---------------- */
const CATS={
  MOVE:  {label:'Fitness',  desc:'movement & sport',  emoji:'🏃', color:'#F6DAD0', dot:'#EC6142',
          types:['Strength','HIIT','CrossFit','Running','Cycling','Swimming','Pilates','Yoga','Walking','Hiking','Stretching','Recovery']},
  SPA:   {label:'Spa & Body',desc:'massage & recovery',emoji:'💆', color:'#D7E9E3', dot:'#2F8072',
          types:['Massage','Deep tissue','Lymphatic drainage','Body scrub','Body wrap','Sauna','Steam','Hot bath','Cryotherapy']},
  FACIAL:{label:'Facial & Skin',desc:'facials & skin', emoji:'✨', color:'#F4DCEA', dot:'#D46AA0',
          types:['Facial','Deep cleansing','Hydration','LED therapy','Dermaplaning','Chemical peel','Microneedling','Laser facial','Acne treatment']},
  HAIR:  {label:'Hair Removal',desc:'wax, laser, IPL', emoji:'💇', color:'#F1E6C6', dot:'#C9931F',
          types:['Waxing','Sugaring','Threading','Laser hair removal','IPL','Electrolysis']},
  AESTH: {label:'Aesthetics',desc:'injectables & tweaks',emoji:'💉', color:'#E7DCF0', dot:'#8E5AA8',
          types:['Botox','Fillers','PRP','Mesotherapy','Skin boosters','Laser','Body contouring']},
  NAILS: {label:'Nails & Beauty',desc:'nails, lashes, brows',emoji:'💅', color:'#D6E2F4', dot:'#4C77C9',
          types:['Manicure','Pedicure','Gel / Shellac','Lash extensions','Lash lift','Brow shaping','Brow lamination','Tanning']},
  MIND:  {label:'Mind & Recovery',desc:'calm & reset', emoji:'🧠', color:'#DEEBCE', dot:'#6FA542',
          types:['Meditation','Breathwork','Journaling','Sleep','Relaxation','Digital detox','Socializing']},
  TRAVEL:{label:'Travel',   desc:'trips & getaways',   emoji:'✈️', color:'#F7E4CE', dot:'#E08A2E',
          types:['Flight','Road trip','Getaway','City break','Beach','Hiking trip']}
};
const CAT_KEYS=Object.keys(CATS);

/* rating meta */
const RATE={
  g:{dot:'🟢',text:'Best time'},
  y:{dot:'🟡',text:'Fine / flexible'},
  o:{dot:'🟠',text:'More sensitive'},
  r:{dot:'🔴',text:'Consider postponing'}
};
/* recommendation matrix: category × phase → [rating, reason]  (a gentle guideline, not medical advice) */
const REC={
  MOVE:  {men:['y','honour low energy — keep it gentle'], foll:['g','prime time for strength & new challenges'], ovu:['g','peak power — go for a PR'], lut:['o','ease into steady, lower-intensity work']},
  SPA:   {men:['g','rest & recovery land beautifully now'], foll:['y','lovely, though your energy wants to move'], ovu:['y','a nice reward after high-energy days'], lut:['g','winding down — massage & sauna feel great']},
  FACIAL:{men:['o','skin’s most sensitive — treatments sting more'], foll:['g','calmest, clearest skin — best for facials'], ovu:['y','skin looks great but can be reactive'], lut:['o','breakouts & sensitivity rising — go gentle']},
  HAIR:  {men:['r','pain’s highest now — waxing really stings'], foll:['g','least sensitive — the best time to book'], ovu:['y','fine, though sensitivity ticks up'], lut:['o','sensitivity rising toward your period']},
  AESTH: {men:['r','more bruising & tenderness — best to wait'], foll:['g','calmest window — less bruising'], ovu:['y','fine, a touch more reactive'], lut:['o','sensitivity rising — go gentle']},

function recentGaps(){const p=[...periods].filter(Boolean).sort();const g=[];for(let i=1;i<p.length;i++)g.push(daysBetween(parseYMD(p[i-1]),parseYMD(p[i])));return g;}
function cycleLen(){const g=recentGaps().slice(-6);if(g.length){const a=Math.round(g.reduce((x,y)=>x+y,0)/g.length);return Math.max(18,Math.min(45,a));}return (cycle&&cycle.cycleLength)||28;}

}

  const days=new Date(y,m+1,0).getDate();let out=[],s=null;
  for(let d=1;d<=days;d++){const k=phaseForDate(new Date(y,m,d)).key;

}
function monthWindows(cat,y,m){

    if(rr==='r'){if(as==null)as=d}else if(as!=null){avoid.push([as,d-1]);as=null}
  }
  if(bs!=null)best.push([bs,days]);if(as!=null)avoid.push([as,days]);
  return {best,avoid,days};

/* ---------------- "when should I…?" ---------------- */
function nextGoodWindow(cat){
  if(!cycle)return null;const len=cycle.cycleLength||28;let start=null,end=null;
  for(let i=0;i<len;i++){const d=addDays(today(),i);const r=(REC[cat]||REC.MOVE)[phaseForDate(d).key][0];
    if(r==='g'){if(start==null)start=d;end=d;}else if(start!=null){break;}}
  return start?{start,end}:null;
}
function betterWhen(cat){
  const w=nextGoodWindow(cat);if(!w)return '';const s=w.start,e=w.end;
  return (+e>+s)?`better ${s.getDate()}${s.getMonth()===e.getMonth()?'':' '+MON[s.getMonth()]}–${e.getDate()} ${MON[e.getMonth()]}`:`better ${s.getDate()} ${MON[s.getMonth()]}`;
}
function openWhen(cat,act){
  whenCat=cat||null;whenAct=act||null;let body;
  if(!whenCat){
    body=`<label class="label" style="display:block;margin-bottom:9px">Pick a type of care</label>
      <div class="catgrid">${CAT_KEYS.map(k=>`<button type="button" class="catcell" style="--c:${CATS[k].color}" onclick="openWhen('${k}')"><span class="ce">${CATS[k].emoji}</span>${CATS[k].label}</button>`).join('')}</div>`;
  }else if(!whenAct){
    const c=CATS[whenCat];
    body=`<div class="whenback"><button onclick="openWhen()">‹ all</button><span>${c.emoji} ${c.label}</span></div>
      <label class="label" style="display:block;margin:14px 0 9px">What exactly?</label>
      <div class="typehint big">${c.types.map(t=>`<button type="button" onclick="openWhen('${whenCat}','${t}')">${t}</button>`).join('')}</div>`;
  }else{
    const c=CATS[whenCat];const win=nextGoodWindow(whenCat);
    const mon=addDays(mondayOf(today()),weekOffset*7);let good=[],warn=[];
    for(let i=0;i<7;i++){const d=addDays(mon,i);const r=(REC[whenCat]||REC.MOVE)[phaseForDate(d).key][0];
      if(r==='g')good.push(DOW[d.getDay()]);else if(r==='o'||r==='r')warn.push(DOW[d.getDay()]);}
    const winTxt=win?`${win.start.getDate()} ${MON[win.start.getMonth()]}${(+win.end>+win.start)?' – '+win.end.getDate()+' '+MON[win.end.getMonth()]:''}`:'—';
    const wp=win?phaseForDate(win.start):null;
    const matched=classes.filter(x=>x.category===whenCat);const monw=mondayOf(today());
    const matchedHtml=matched.length?`<div class="label" style="margin:20px 2px 8px">Your saved classes</div><div class="acts">${matched.map(x=>{
      const cd=addDays(monw,(x.day+6)%7);const gr=(REC[whenCat]||REC.MOVE)[phaseForDate(cd).key][0];const goodDay=gr==='g';
      return `<button class="act" onclick="planClass('${x.id}')"><span class="cat-badge" style="--c:${c.color}">${c.emoji}</span><span class="body"><div class="a-top"><span class="a-name">${esc(x.name)}</span>${goodDay?`<span class="cost" style="color:${PHASES.foll.accent}">good day</span>`:''}</div><div class="a-sub">${DOW[x.day]}${x.time?' '+fmtTime(x.time):''} · ${esc(placeName(x.placeId))}</div></span></button>`;
    }).join('')}</div>`:`<div class="muted" style="margin-top:16px;font-size:12.5px;text-align:center">Save your studios & classes to get real suggestions here. <button class="linklike" onclick="closeSheet();openPlaces()">Add places</button></div>`;
    body=`<div class="whenback"><button onclick="openWhen('${whenCat}')">‹ ${c.label}</button></div>
      <div class="whenres">
        <div class="whenact">${c.emoji} ${esc(whenAct)}</div>
        <div class="whenwin">${winTxt}</div>
        ${wp?`<div class="whenphase" style="color:${wp.accent}">${wp.label} — ${(REC[whenCat]||REC.MOVE)[wp.key][1]}</div>`:''}
        <div class="whenweek">
          ${good.length?`<div><b style="color:${PHASES.foll.accent}">Good this week</b> · ${good.join(', ')}</div>`:`<div class="muted">Nothing ideal this week — ${winTxt} is your window.</div>`}
          ${warn.length?`<div class="muted">Maybe wait · ${warn.join(', ')}</div>`:''}
        </div>
      </div>
      ${matchedHtml}
      <div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()">Close</button><button class="btn primary" onclick="closeSheet();openActivity(null,{category:'${whenCat}',type:'${whenAct}'})">Add to my plan</button></div>`;
  }
  sheet(`<h2 class="serif">When should I…?</h2>
    <div class="sub">Pick something — I’ll tell you the best time in your cycle.</div>
    ${body}`);
}

/* ---------------- backup & calendar (.ics) ---------------- */
function pad2(n){return String(n).padStart(2,'0')}
function addHour(t){const[h,m]=(t||'09:00').split(':').map(Number);return pad2((h+1)%24)+':'+pad2(m||0)}
function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportData(){download('faze-backup-'+ymd(today())+'.json',JSON.stringify({_app:'faze',_v:1,_exported:new Date().toISOString(),cycle,periods,activities,passes,places,classes},null,2),'application/json');}
function importData(input){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();
  r.onload=function(){try{const d=JSON.parse(r.result);
    if(d.cycle){cycle=d.cycle;save(K_CYCLE,cycle);} if(d.periods){periods=d.periods;save(K_PERIODS,periods);}
    if(d.activities){activities=d.activities;save(K_ACTS,activities);} if(d.passes){passes=d.passes;save(K_PASSES,passes);}
    if(d.places){places=d.places;save(K_PLACES,places);} if(d.classes){classes=d.classes;save(K_CLASSES,classes);}
    closeSheet();render();alert('Backup restored ✓');
  }catch(e){alert('Sorry — that file could not be read.');}};
  r.readAsText(f);}
function exportICS(){
  const dowMap=['SU','MO','TU','WE','TH','FR','SA'];
  const dt=(d,t)=>{const[h,m]=(t||'09:00').split(':');return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'T'+pad2(h)+pad2(m)+'00';};
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Faze//EN','CALSCALE:GREGORIAN'];
  activities.forEach(a=>{const cat=catOf(a);const title=((a.type||cat.label)+(a.place?' · '+a.place:'')).replace(/[,;\\]/g,' ');
    L.push('BEGIN:VEVENT','UID:'+a.id+'@faze');
    if(a.recurring){const w0=(a.daysOfWeek&&a.daysOfWeek.length)?a.daysOfWeek[0]:1;let f=new Date(today()),guard=0;while(f.getDay()!==w0&&guard++<7)f=addDays(f,1);
      L.push('DTSTART:'+dt(f,a.time),'DTEND:'+dt(f,addHour(a.time)),'RRULE:FREQ=WEEKLY;BYDAY='+(a.daysOfWeek||[w0]).map(w=>dowMap[w]).join(','));
    }else{const d=parseYMD(a.date);L.push('DTSTART:'+dt(d,a.time),'DTEND:'+dt(d,addHour(a.time)));}
    L.push('SUMMARY:'+title,'END:VEVENT');
  });
  const np=nextPeriodStart();
  if(np){L.push('BEGIN:VEVENT','UID:period-'+ymd(np)+'@faze','DTSTART;VALUE=DATE:'+np.getFullYear()+pad2(np.getMonth()+1)+pad2(np.getDate()),'SUMMARY:Period (predicted) — Fáze','END:VEVENT');}
  L.push('END:VCALENDAR');
  download('faze-plan.ics',L.join('\r\n'),'text/calendar');
}
function openBackup(){
  sheet(`<h2 class="serif">Data & calendar</h2>
    <div class="sub">Everything lives on this device — back it up so you never lose it.</div>
    <div class="acts" style="margin:2px 0 16px">
      <button class="act" onclick="exportData()"><span class="cat-badge" style="--c:#DEEBCE">💾</span><span class="body"><div class="a-name">Export backup</div><div class="a-sub">Download all your data as a file</div></span></button>
      <button class="act" onclick="document.getElementById('imp').click()"><span class="cat-badge" style="--c:#D6E2F4">📥</span><span class="body"><div class="a-name">Restore from backup</div><div class="a-sub">Load a file you saved before</div></span></button>
      <button class="act" onclick="exportICS()"><span class="cat-badge" style="--c:#F6DAD0">📅</span><span class="body"><div class="a-name">Add my plan to calendar</div><div class="a-sub">Your classes & next period (.ics)</div></span></button>
    </div>
    <input type="file" id="imp" accept="application/json,.json" onchange="importData(this)" style="display:none">
    <div class="sheet-actions"><button class="btn primary" onclick="closeSheet()">Close</button></div>`);
}
